services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: bildkeller
      POSTGRES_USER: bildkeller
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bildkeller -d bildkeller"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://bildkeller:${POSTGRES_PASSWORD:-change-me}@db:5432/bildkeller
      MEDIA_DIR: /data/media
    volumes:
      - media-data:/data/media
    ports:
      - "${PORT:-3000}:3000"

volumes:
  db-data:
  media-data:
